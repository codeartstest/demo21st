<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A precision calculator with a modern dark interface, powered by a remote computation API." />
    <title>Nova Calculator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="ambient" aria-hidden="true">
      <span class="ambient__orb ambient__orb--indigo"></span>
      <span class="ambient__orb ambient__orb--purple"></span>
      <span class="ambient__grain"></span>
    </div>

    <main class="stage">
      <section class="device" aria-label="Calculator">
        <header class="device__header">
          <div class="brand">
            <span class="brand__mark" aria-hidden="true"></span>
            <span class="brand__name">Nova</span>
          </div>
          <span class="device__status" id="status">ready</span>
        </header>

        <div class="display" role="region" aria-label="Calculator display">
          <span class="display__expression" id="expression" aria-live="polite"></span>
          <output class="display__value" id="display" aria-live="polite" aria-atomic="true">0</output>
          <span class="display__shimmer" aria-hidden="true"></span>
        </div>

        <div class="keypad" id="keypad" role="group" aria-label="Calculator keys">
          <button class="key key--util" data-action="clear" aria-label="Clear all">AC</button>
          <button class="key key--util" data-action="clear-entry" aria-label="Clear entry">CE</button>
          <button class="key key--util" data-action="sign" aria-label="Toggle sign">±</button>
          <button class="key key--util" data-action="percent" aria-label="Percent">%</button>

          <button class="key" data-action="digit" data-digit="7">7</button>
          <button class="key" data-action="digit" data-digit="8">8</button>
          <button class="key" data-action="digit" data-digit="9">9</button>
          <button class="key key--operator" data-action="operator" data-op="divide" aria-label="Divide">÷</button>

          <button class="key" data-action="digit" data-digit="4">4</button>
          <button class="key" data-action="digit" data-digit="5">5</button>
          <button class="key" data-action="digit" data-digit="6">6</button>
          <button class="key key--operator" data-action="operator" data-op="multiply" aria-label="Multiply">×</button>

          <button class="key" data-action="digit" data-digit="1">1</button>
          <button class="key" data-action="digit" data-digit="2">2</button>
          <button class="key" data-action="digit" data-digit="3">3</button>
          <button class="key key--operator" data-action="operator" data-op="subtract" aria-label="Subtract">−</button>

          <button class="key key--wide" data-action="digit" data-digit="0">0</button>
          <button class="key" data-action="decimal">.</button>
          <button class="key key--operator" data-action="operator" data-op="add" aria-label="Add">+</button>
        </div>

        <div class="equals-row">
          <button class="key key--equals" data-action="equals" aria-label="Equals">=</button>
        </div>

        <footer class="device__footer">
          <span class="device__hint">Enter = · Esc clears · Backspace deletes</span>
        </footer>
      </section>
    </main>

    <script src="js/calculator.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
